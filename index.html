<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="pkgwatch — get an email when an npm package publishes a new version. Watch packages like tags, verify your email once, stay current." />
    <title>pkgwatch — npm update email notifier</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1' y='8' width='30' height='16' rx='8' fill='%23ff99d3'/%3E%3Ccircle cx='11' cy='16' r='4' fill='%233d0012'/%3E%3Ccircle cx='21' cy='16' r='4' fill='%233d0012'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Google Fonts: Hanken Grotesk for text; the second family loads for literal code only (package names, versions, verification codes) -->
    <link rel="stylesheet" href="fonts.css" />
    <script>
      // apply saved theme before paint
      (function () {
        var t = localStorage.getItem('pw-theme');
        if (!t) t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;
        document.documentElement.classList.add('js');
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
